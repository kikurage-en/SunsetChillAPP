[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zushi-chill"
version = "0.1.0"
description = "Internal MVP for Zushi sunset chill index notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.4.10",
]

[project.scripts]
zushi-chill = "zushi_chill.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
