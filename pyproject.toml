[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zushi-chill"
version = "0.1.0"
description = "Internal MVP for Zushi sunset chill index notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "astral==3.2",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.4.10",
]

[project.scripts]
zushi-chill = "zushi_chill.main:main"
zushi-chill-contabo-daily = "zushi_chill.contabo_daily:main"
zushi-chill-trigger-actions = "zushi_chill.github_actions_trigger:main"
zushi-chill-sunset-eta = "zushi_chill.sunset_eta:main"
zushi-chill-observation-scheduler = "zushi_chill.observation_scheduler:main"
zushi-chill-webhook = "zushi_chill.webhook_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["zushi_chill"]
