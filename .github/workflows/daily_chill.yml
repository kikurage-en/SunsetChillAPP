name: Daily Zushi Chill Index
run-name: SunsetChill ${{ inputs.observation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      manual_mode:
        description: "手動テスト種別"
        required: false
        type: choice
        default: "dry_run"
        options:
          - dry_run
          - send_line
      date:
        description: "対象日 YYYY-MM-DD"
        required: false
        default: ""
      run_time:
        description: "実行時刻 HH:MM"
        required: false
        default: ""
      observation_id:
        description: "永続観測ID YYYY-MM-DD:phase"
        required: false
        default: ""
      observation_phase:
        description: "観測フェーズ"
        required: false
        type: choice
        default: "sunset"
        options:
          - sunset
          - afterglow
      scheduled_at:
        description: "予定撮影時刻 ISO-8601"
        required: false
        default: ""
      captured_at:
        description: "実撮影時刻 ISO-8601"
        required: false
        default: ""
      capture_ref:
        description: "保存画像のGit ref"
        required: false
        default: ""
      capture_path:
        description: "保存画像のリポジトリ内パス"
        required: false
        default: ""
      capture_base64:
        description: "Base64符号化した固定観測画像"
        required: false
        default: ""
      capture_sha256:
        description: "保存画像のSHA-256"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-zushi-chill-${{ github.ref }}
      cancel-in-progress: false
    env:
      STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND || 'csv' }}
      CSV_PATH: ${{ secrets.CSV_PATH || 'logs/chill_predictions.csv' }}
      LIVE_CAMERA_URL: ${{ secrets.LIVE_CAMERA_URL || 'https://www.youtube.com/watch?v=Q5AAi9KOjG0' }}
      LIVE_CAMERA_VIDEO_ID: ${{ secrets.LIVE_CAMERA_VIDEO_ID || 'Q5AAi9KOjG0' }}
      LIVE_CAMERA_IMAGE_BASE_URL: ${{ secrets.LIVE_CAMERA_IMAGE_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      JMA_FORECAST_ENABLED: "true"
      JMA_OFFICE_CODE: "140000"
      JMA_AREA_CODE: "140010"
      JMA_TIMEOUT_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" yt-dlp

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Resolve run timestamp
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.date || '' }}
          INPUT_RUN_TIME: ${{ github.event.inputs.run_time || '' }}
          INPUT_OBSERVATION_ID: ${{ github.event.inputs.observation_id || '' }}
          INPUT_OBSERVATION_PHASE: ${{ github.event.inputs.observation_phase || '' }}
          INPUT_SCHEDULED_AT: ${{ github.event.inputs.scheduled_at || '' }}
          INPUT_CAPTURED_AT: ${{ github.event.inputs.captured_at || '' }}
          INPUT_CAPTURE_REF: ${{ github.event.inputs.capture_ref || '' }}
          INPUT_CAPTURE_PATH: ${{ github.event.inputs.capture_path || '' }}
          INPUT_CAPTURE_SHA256: ${{ github.event.inputs.capture_sha256 || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          RUN_DATE="$INPUT_RUN_DATE"
          RUN_TIME="$INPUT_RUN_TIME"
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          if [ -z "$RUN_TIME" ]; then
            RUN_TIME="$(TZ=Asia/Tokyo date +%H:%M)"
          fi
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "RUN_TIME=$RUN_TIME" >> "$GITHUB_ENV"
          RUN_TIME_COMPACT="${RUN_TIME/:/}"
          echo "RUN_TIME_COMPACT=$RUN_TIME_COMPACT" >> "$GITHUB_ENV"
          echo "LIVE_CAMERA_IMAGE_RELATIVE_PATH=live-camera/$RUN_DATE/$RUN_TIME_COMPACT.jpg" >> "$GITHUB_ENV"
          echo "OBSERVATION_ID=$INPUT_OBSERVATION_ID" >> "$GITHUB_ENV"
          echo "OBSERVATION_PHASE=$INPUT_OBSERVATION_PHASE" >> "$GITHUB_ENV"
          echo "SCHEDULED_AT=$INPUT_SCHEDULED_AT" >> "$GITHUB_ENV"
          echo "CAPTURED_AT=$INPUT_CAPTURED_AT" >> "$GITHUB_ENV"
          echo "CAPTURE_REF=$INPUT_CAPTURE_REF" >> "$GITHUB_ENV"
          echo "CAPTURE_PATH=$INPUT_CAPTURE_PATH" >> "$GITHUB_ENV"
          echo "CAPTURE_SHA256=$INPUT_CAPTURE_SHA256" >> "$GITHUB_ENV"

      - name: Capture live camera image
        env:
          INPUT_CAPTURE_BASE64: ${{ github.event.inputs.capture_base64 || '' }}
        run: |
          mkdir -p "public/$(dirname "$LIVE_CAMERA_IMAGE_RELATIVE_PATH")"
          IMAGE_PATH="public/$LIVE_CAMERA_IMAGE_RELATIVE_PATH"
          if [ -n "$INPUT_CAPTURE_BASE64" ]; then
            if ! printf '%s' "$INPUT_CAPTURE_BASE64" | base64 --decode > "$IMAGE_PATH"; then
              echo "::error::Inline observation image could not be decoded"
              exit 1
            fi
            if [ ! -s "$IMAGE_PATH" ]; then
              echo "::error::Inline observation image is empty"
              exit 1
            fi
            ACTUAL_CAPTURE_SHA256="$(sha256sum "$IMAGE_PATH" | cut -d' ' -f1)"
            if [ -z "$CAPTURE_SHA256" ] || [ "$ACTUAL_CAPTURE_SHA256" != "$CAPTURE_SHA256" ]; then
              echo "::error::Inline observation image checksum does not match"
              exit 1
            fi
            echo "Using inline observation image"
            echo "LIVE_CAMERA_IMAGE_URL=$LIVE_CAMERA_IMAGE_BASE_URL/$LIVE_CAMERA_IMAGE_RELATIVE_PATH" >> "$GITHUB_ENV"
            exit 0
          elif [ -n "$CAPTURE_PATH" ]; then
            if [ -z "$CAPTURE_REF" ]; then
              echo "::error::capture_ref is required when capture_path is set"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$CAPTURE_REF"
            if ! git show "FETCH_HEAD:$CAPTURE_PATH" > "$IMAGE_PATH"; then
              echo "::error::Archived observation image could not be read"
              exit 1
            fi
            if [ ! -s "$IMAGE_PATH" ]; then
              echo "::error::Archived observation image is empty"
              exit 1
            fi
            ACTUAL_CAPTURE_SHA256="$(sha256sum "$IMAGE_PATH" | cut -d' ' -f1)"
            if [ -z "$CAPTURE_SHA256" ] || [ "$ACTUAL_CAPTURE_SHA256" != "$CAPTURE_SHA256" ]; then
              echo "::error::Archived observation image checksum does not match"
              exit 1
            fi
            echo "Using archived observation image: $CAPTURE_REF:$CAPTURE_PATH"
            echo "LIVE_CAMERA_IMAGE_URL=$LIVE_CAMERA_IMAGE_BASE_URL/$LIVE_CAMERA_IMAGE_RELATIVE_PATH" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          STREAM_URL="$(yt-dlp --no-playlist --format "best[protocol^=m3u8]/best" --get-url "$LIVE_CAMERA_URL" 2>yt-dlp-error.log | head -n 1)"
          YT_DLP_STATUS=$?
          set -e
          if [ "$YT_DLP_STATUS" -ne 0 ]; then
            cat yt-dlp-error.log
            echo "::warning::Live camera stream URL could not be resolved"
          fi
          if [ -z "$STREAM_URL" ]; then
            cat yt-dlp-error.log
            echo "::warning::Live camera stream URL could not be resolved"
          fi
          if [ -n "$STREAM_URL" ] && ffmpeg -hide_banner -loglevel error -y -i "$STREAM_URL" -frames:v 1 "$IMAGE_PATH"; then
            echo "LIVE_CAMERA_IMAGE_URL=$LIVE_CAMERA_IMAGE_BASE_URL/$LIVE_CAMERA_IMAGE_RELATIVE_PATH" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::Falling back to YouTube live thumbnail"
          for thumbnail_url in \
            "https://i.ytimg.com/vi/$LIVE_CAMERA_VIDEO_ID/maxresdefault_live.jpg" \
            "https://i.ytimg.com/vi/$LIVE_CAMERA_VIDEO_ID/hqdefault_live.jpg" \
            "https://i.ytimg.com/vi/$LIVE_CAMERA_VIDEO_ID/maxresdefault.jpg" \
            "https://i.ytimg.com/vi/$LIVE_CAMERA_VIDEO_ID/hqdefault.jpg"
          do
            if curl --fail --location --silent --show-error --output "$IMAGE_PATH" "$thumbnail_url"; then
              echo "Captured fallback thumbnail: $thumbnail_url"
              echo "LIVE_CAMERA_IMAGE_URL=$LIVE_CAMERA_IMAGE_BASE_URL/$LIVE_CAMERA_IMAGE_RELATIVE_PATH" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "::warning::Live camera image capture failed"

      - name: Archive live camera image
        if: env.LIVE_CAMERA_IMAGE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: live-camera-${{ env.RUN_DATE }}-${{ env.RUN_TIME_COMPACT }}
          path: public/${{ env.LIVE_CAMERA_IMAGE_RELATIVE_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Configure Pages
        if: env.LIVE_CAMERA_IMAGE_URL != ''
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: env.LIVE_CAMERA_IMAGE_URL != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        if: env.LIVE_CAMERA_IMAGE_URL != ''
        uses: actions/deploy-pages@v4

      - name: Run chill index
        env:
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Tokyo' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_WORKSHEET: ${{ secrets.GOOGLE_SHEETS_WORKSHEET || 'predictions' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ALLOW_MISSING_HOURLY_FIELDS: ${{ secrets.ALLOW_MISSING_HOURLY_FIELDS || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_mode != 'send_line' && 'true' || 'false' }}
          LIVE_CAMERA_IMAGE_BASE_URL: ""
          SCHEDULE: ${{ github.event.schedule || '' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          VISION_ENABLED: ${{ secrets.VISION_ENABLED || 'false' }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_MODEL: ${{ secrets.VISION_MODEL || 'gemini-2.5-flash' }}
          VISION_TIMEOUT_SECONDS: ${{ secrets.VISION_TIMEOUT_SECONDS || '30' }}
          VISION_TARGET_HOURS: ${{ secrets.VISION_TARGET_HOURS || secrets.VISION_TARGET_HOUR || '16,17,18,19' }}
          SUNSET_CLOUD_OFFSET_KM: ${{ secrets.SUNSET_CLOUD_OFFSET_KM || '40' }}
          SUNSET_CLOUD_NEAR_OFFSET_KM: ${{ secrets.SUNSET_CLOUD_NEAR_OFFSET_KM || '20' }}
          SUNSET_VISION_BLEND_WEIGHT: ${{ secrets.SUNSET_VISION_BLEND_WEIGHT || '0.8' }}
          SUNSETHUE_ENABLED: ${{ secrets.SUNSETHUE_ENABLED || 'false' }}
          SUNSETHUE_API_KEY: ${{ secrets.SUNSETHUE_API_KEY }}
          SUNSETHUE_TIMEOUT_SECONDS: ${{ secrets.SUNSETHUE_TIMEOUT_SECONDS || '20' }}
        run: |
          echo "Live camera image URL: ${LIVE_CAMERA_IMAGE_URL:-none}"
          args=()
          if [ -n "$RUN_DATE" ]; then
            args+=(--date "$RUN_DATE")
          fi
          if [ -n "$RUN_TIME" ]; then
            args+=(--run-time "$RUN_TIME")
          fi
          if [ -n "$OBSERVATION_ID" ]; then
            args+=(
              --observation-id "$OBSERVATION_ID"
              --observation-phase "$OBSERVATION_PHASE"
              --scheduled-at "$SCHEDULED_AT"
              --captured-at "$CAPTURED_AT"
            )
          fi
          python -m zushi_chill.main "${args[@]}"

      - name: Upload CSV log
        if: always() && env.STORAGE_BACKEND == 'csv'
        uses: actions/upload-artifact@v4
        with:
          name: chill-predictions
          path: ${{ env.CSV_PATH }}
          if-no-files-found: ignore

      - name: Notify failure via LINE
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || github.event.inputs.manual_mode != 'dry_run') }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$LINE_TARGET_ID" ]; then
            echo "::warning::LINE secrets not set; skipping failure notification"
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload="$(printf '{"to":"%s","messages":[{"type":"text","text":"⚠️ SunsetChill実行失敗 %s %s\\n%s"}]}' \
            "$LINE_TARGET_ID" "${RUN_DATE:-?}" "${RUN_TIME:-?}" "$run_url")"
          if ! curl -fsS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"; then
            echo "::warning::LINE failure notification could not be delivered"
          fi
