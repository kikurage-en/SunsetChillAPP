name: Fireworks Watch 2026-07-30
run-name: Zushi fireworks ${{ github.event_name }} ${{ github.run_id }}

on:
  # Start early and wait inside the job. Scheduled Actions can be delayed.
  # This file is removed after the event, and the date guard prevents later years.
  schedule:
    - cron: "45 9 30 7 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        type: choice
        default: "dry_run"
        options:
          - dry_run
          - send_line
      duration_seconds:
        description: "手動テスト監視秒数（空なら60秒）"
        required: false
        default: "60"
      start_at:
        description: "手動開始時刻 ISO-8601（空なら即時）"
        required: false
        default: ""
      max_images:
        description: "最大送信枚数"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    concurrency:
      group: zushi-fireworks-watch-20260730
      cancel-in-progress: false
    env:
      EVENT_DATE: "2026-07-30"
      TIMEZONE: Asia/Tokyo
      LIVE_CAMERA_URL: ${{ secrets.LIVE_CAMERA_URL || 'https://www.youtube.com/watch?v=Q5AAi9KOjG0' }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
      VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
      VISION_MODEL: ${{ secrets.VISION_MODEL || 'gemini-2.5-flash' }}
      FIREWORKS_IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/pages-images

    steps:
      - name: Guard one-day schedule
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$(TZ=Asia/Tokyo date +%F)" != "$EVENT_DATE" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out monitor code
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Check out image history
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: pages-images
          path: public
          fetch-depth: 1

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -e ".[dev]" yt-dlp

      - name: Run focused checks
        if: steps.guard.outputs.run == 'true'
        run: |
          ruff check src/zushi_chill/fireworks_monitor.py tests/test_fireworks_monitor.py
          pytest -q tests/test_fireworks_monitor.py tests/test_comment_voice.py

      - name: Configure image archive
        if: steps.guard.outputs.run == 'true'
        run: |
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Monitor live camera
        if: steps.guard.outputs.run == 'true'
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}
          INPUT_DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '' }}
          INPUT_START_AT: ${{ github.event.inputs.start_at || '' }}
          INPUT_MAX_IMAGES: ${{ github.event.inputs.max_images || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MODE="$INPUT_MODE"
          START_AT="$INPUT_START_AT"
          DURATION_SECONDS="${INPUT_DURATION_SECONDS:-60}"
          MAX_IMAGES="${INPUT_MAX_IMAGES:-6}"
          EXTRA_ARGS=()

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            MODE="send_line"
            START_AT="2026-07-30T19:30:00+09:00"
            END_AT="2026-07-30T20:30:00+09:00"
            EXTRA_ARGS+=(--end-at "$END_AT")
          else
            EXTRA_ARGS+=(--duration-seconds "$DURATION_SECONDS")
          fi
          if [[ -n "$START_AT" ]]; then
            EXTRA_ARGS+=(--start-at "$START_AT")
          fi
          if [[ "$MODE" != "send_line" ]]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          python -m zushi_chill.fireworks_monitor \
            --pages-dir public \
            --accepted-dir artifacts/fireworks-candidates \
            --max-images "$MAX_IMAGES" \
            "${EXTRA_ARGS[@]}"

      - name: Archive monitor candidates
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fireworks-monitor-${{ github.run_id }}
          path: artifacts/fireworks-candidates/*.jpg
          if-no-files-found: ignore
          retention-days: 7
