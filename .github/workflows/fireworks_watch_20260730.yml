name: Fireworks Watch 2026-07-30
run-name: Zushi fireworks candidates ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        type: choice
        default: "dry_run"
        options:
          - dry_run
          - send_line
      status:
        description: "ローカル収集結果"
        required: true
        type: choice
        default: "ok"
        options:
          - ok
          - partial
          - monitor_error
      candidate_paths:
        description: "pages-images上の候補パスJSON"
        required: true
        default: "[]"
      max_images:
        description: "最大送信枚数"
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  analyze-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: zushi-fireworks-send-20260730
      cancel-in-progress: false
    env:
      EVENT_DATE: "2026-07-30"
      TIMEZONE: Asia/Tokyo
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
      VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
      VISION_MODEL: ${{ secrets.VISION_MODEL || 'gemini-2.5-flash' }}
      FIREWORKS_IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/pages-images

    steps:
      - name: Check out analysis code
        uses: actions/checkout@v7

      - name: Check out collected candidates
        uses: actions/checkout@v7
        with:
          ref: pages-images
          path: public
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run focused checks
        run: |
          ruff check \
            src/zushi_chill/fireworks_monitor.py \
            src/zushi_chill/fireworks_batch.py \
            tests/test_fireworks_monitor.py \
            tests/test_fireworks_batch.py
          pytest -q \
            tests/test_fireworks_monitor.py \
            tests/test_fireworks_batch.py \
            tests/test_comment_voice.py

      - name: Analyze candidates and send LINE
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_STATUS: ${{ github.event.inputs.status }}
          INPUT_CANDIDATE_PATHS: ${{ github.event.inputs.candidate_paths }}
          INPUT_MAX_IMAGES: ${{ github.event.inputs.max_images || '6' }}
        run: |
          EXTRA_ARGS=()
          if [[ "$INPUT_MODE" != "send_line" ]]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          python -m zushi_chill.fireworks_batch \
            --pages-dir public \
            --status "$INPUT_STATUS" \
            --candidate-paths-json "$INPUT_CANDIDATE_PATHS" \
            --max-images "$INPUT_MAX_IMAGES" \
            "${EXTRA_ARGS[@]}"
